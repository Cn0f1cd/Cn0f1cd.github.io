<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AimTester - 喵准测试</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #fff;
            image-rendering: pixelated;
            background: #000;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 10;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🎯 喵准测试 AimTester</h1>
        <div>时间: <span id="time">60</span>s | 分数: <span id="score">0</span> | 命中: <span id="hits">0</span></div>
        <button onclick="startGame()">开始游戏</button>
        <button onclick="restartGame()">重新开始</button>
    </div>
    <canvas id="game" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let score = 0;
        let hits = 0;
        let timeLeft = 60;
        let targets = [];
        let gameRunning = false;
        let timer;

        class Target {
            constructor() {
                this.radius = Math.random() * 20 + 15;
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = Math.random() * (canvas.height - this.radius * 2) + this.radius;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.color = '#ff0000';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) this.vx *= -1;
                if (this.y - this.radius < 0 || this.y + this.radius > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function spawnTargets(count) {
            for (let i = 0; i < count; i++) {
                targets.push(new Target());
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            targets.forEach(t => {
                t.update();
                t.draw();
            });
        }

        function gameLoop() {
            if (!gameRunning) return;
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            score = 0;
            hits = 0;
            timeLeft = 60;
            targets = [];
            spawnTargets(6);
            updateUI();

            timer = setInterval(() => {
                timeLeft--;
                updateUI();
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            gameLoop();
        }

        function endGame() {
            gameRunning = false;
            clearInterval(timer);
            alert(`游戏结束！\n最终分数: ${score}\n命中次数: ${hits}`);
        }

        function updateUI() {
            document.getElementById('time').textContent = timeLeft;
            document.getElementById('score').textContent = score;
            document.getElementById('hits').textContent = hits;
        }

        function restartGame() {
            clearInterval(timer);
            startGame();
        }

        canvas.addEventListener('click', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                const dx = mx - t.x;
                const dy = my - t.y;
                if (dx * dx + dy * dy < t.radius * t.radius) {
                    hits++;
                    score += Math.floor(30 / t.radius) * 10;
                    targets.splice(i, 1);
                    targets.push(new Target());
                    updateUI();
                    break;
                }
            }
        });

        // 键盘支持 R 键重启
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r') {
                restartGame();
            }
        });

        // 初始化提示
        ctx.fillStyle = '#fff';
        ctx.font = '30px Arial';
        ctx.fillText('点击「开始游戏」开始喵准测试！', 150, 300);
    </script>
</body>
</html>
